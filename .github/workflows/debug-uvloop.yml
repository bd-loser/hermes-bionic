name: debug-uvloop

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe uvloop sdist build inside termux-docker
        run: |
          set -eu
          mkdir -p ../out && chmod 0777 ../out
          cat > ../out/probe.sh <<'EOS'
          set -x
          apt update -y
          apt install -y git python clang make pkg-config curl ca-certificates patch >/dev/null
          echo "== is there a /bin/sh? =="; ls -la /bin/sh || echo "NO /bin/sh"
          command -v sh; ls -la "$(command -v sh)"
          # The unifying fix hypothesis: scripts with `#!/bin/sh` fail as
          # ENOENT(script-path) / rc=126 when /bin/sh is absent.
          mkdir -p /bin 2>/dev/null || true
          ln -sf "$(command -v sh)" /bin/sh 2>/dev/null || true
          ls -la /bin/sh
          PYBIN=python
          if ! python -c 'import sys;raise SystemExit(0 if (3,11)<=sys.version_info[:2]<(3,14) else 1)' 2>/dev/null; then
            pkg install -y tur-repo >/dev/null 2>&1 || true
            pkg install -y python3.13 >/dev/null 2>&1 || true
            PYBIN=python3.13
          fi
          export TMPDIR="$HOME/tmp"; mkdir -p "$TMPDIR"
          $PYBIN -m venv "$HOME/benv"
          . "$HOME/benv/bin/activate"
          pip install --upgrade pip wheel setuptools >/dev/null
          pip download uvloop==0.22.1 --no-binary :all: --no-deps -d "$TMPDIR/dl"
          tar -xzf "$TMPDIR"/dl/uvloop-0.22.1.tar.gz -C "$TMPDIR"
          cd "$TMPDIR/uvloop-0.22.1"
          export ANDROID_API_LEVEL=24
          echo "== configure direct run =="
          (cd vendor/libuv && ./configure --help 2>&1 | head -2) || echo "configure failed"
          echo "== PATH 1 full build output =="
          pip wheel . --no-deps -w "$TMPDIR/out1" 2>&1 | tee "$TMPDIR/b1.log" | tail -3
          grep -anB4 -A8 -iE "error|failed" "$TMPDIR/b1.log" | grep -aiE "error|failed|cannot|undefined|configure:|clang|no such" | grep -aviE "did not run|Failed to build one|Failed building wheel for uvloop|error originates" | head -30
          ls "$TMPDIR"/out1/*.whl 2>/dev/null && echo "UNPATCHED-BUILD-OK" || echo "UNPATCHED-BUILD-FAILED"
          EOS
          chmod 0777 ../out/probe.sh
          docker run --rm -v "$PWD:/workspace" -v "$PWD/../out:/out" -w /workspace \
            termux/termux-docker:aarch64 bash /out/probe.sh
