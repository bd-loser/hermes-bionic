name: camofox-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Patch-apply audit (camoufox 156 + termux firefox patches)
        env:
          CAMOFOX_PIN: "6f74fa06df586b8dce7a86c6d2b35a1c13b498b2"
          TERMUX_PKGS_PIN: "e462d86688f194debff9073440b3b6b72a7a35ae"
        run: |
          set -o pipefail
          bash camofox/audit-on-runner.sh 2>&1 | tee camofox-audit.log

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camofox-patch-audit
          path: |
            camofox-out/
            camofox-audit.log
          if-no-files-found: error
          retention-days: 30
