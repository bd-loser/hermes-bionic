name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Hermes release to build (blank = versions.json)"
        required: false
        default: ""
      upstream_ref:
        description: "Build from this branch/commit/tag instead of the pinned release"
        required: false
        default: ""
      prerelease:
        description: "Publish the wheel-bundle release as prerelease"
        type: boolean
        default: false
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: false

concurrency:
  # Serializes publishes: two builds resolving the same tag would race on
  # the release upload. Different versions share the group too — a phone
  # installs exactly one bundle, so overlapping builds add no value.
  group: build
  cancel-in-progress: false

jobs:
  wheels:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          set -eu
          VERSION="${{ inputs.version }}"
          [ -z "$VERSION" ] && VERSION="$(jq -r .hermes versions.json)"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Building hermes-agent ${VERSION#v}"

      # The pip/cargo caches are the difference between a ~30 min build and
      # a minutes-long one: pip's wheel cache is content-addressed, so every
      # native wheel (cryptography, pydantic-core, uvloop, Pillow, ...) that
      # didn't change since the last run is restored ready-made. Mounted
      # into termux-docker at /ci-cache (see build-on-runner.sh); restore-
      # keys are a prefix, so a new upstream version still reuses the bulk.
      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ../ci-cache/pip
            ../ci-cache/pip-a
            ../ci-cache/pip-b
            ../ci-cache/cargo
          key: ci-cache-v1-${{ steps.v.outputs.version }}-${{ hashFiles('ci/build-in-container.sh') }}
          restore-keys: |
            ci-cache-v1-

      - name: Build wheel bundle in termux-docker
        env:
          HERMES_VERSION: ${{ steps.v.outputs.version }}
          HERMES_UPSTREAM_REF: ${{ inputs.upstream_ref }}
        # tee, not `>`: docker progress streams into the Actions log live.
        run: |
          set -o pipefail
          bash ci/build-on-runner.sh 2>&1 | tee out-host.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -eu
          OUT_HOST="$GITHUB_WORKSPACE/../out"
          TAG="v$VERSION"
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="$FLAGS --prerelease"
          [ "$DRAFT" = "true" ] && FLAGS="$FLAGS --draft"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT_HOST"/hermes-wheels-*.tar.gz* --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$TAG" $FLAGS \
              --title "hermes-agent $VERSION (Termux wheels)" \
              --notes "Prebuilt \`.[termux]\` dependency wheel bundle for Termux/Bionic aarch64, compiled in termux-docker. Install with the repo install.sh — dependencies resolve from local wheels; only hermes-agent itself is installed from its upstream git tag." \
              "$OUT_HOST"/hermes-wheels-*.tar.gz "$OUT_HOST"/hermes-wheels-*.tar.gz.sha256
          fi
