name: watch-upstream

# Mirrors upstream hermes-agent releases (including prereleases, whose flag
# we copy) into versions.json + a wheel-bundle release, or builds the
# latest unseen `main` commit as a dev prerelease when no release bump is
# pending.
#
# It also stops itself. If a build this workflow dispatched does not survive,
# the next run parks a WATCH_PAUSED variable, opens one labelled issue, and
# then exits clean on every following tick. Re-dispatching the same broken
# build every 12h only produces a wall of red X's nobody reads; the failure
# is already on record the first time. To start watching again, run this
# workflow with force=true (which also closes the pause notice).

on:
  schedule:
    # 02:17 and 14:17 UTC. Off-minute on purpose: the top of the hour is
    # when every other cron on the platform fires.
    - cron: "17 2,14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would happen, but don't commit or dispatch."
        type: boolean
        default: false
      force_version:
        description: "Force bump to this upstream version (leave blank to auto-detect)."
        type: string
        default: ""
      force:
        description: "Ignore an active pause and watch again (also use to resume after fixing a failed build)."
        type: boolean
        default: false
      skip_dev:
        description: "Skip the dev-branch prerelease build this run."
        type: boolean
        default: false
      draft:
        description: "Create any release dispatched by this run as a draft."
        type: boolean
        default: false

concurrency:
  group: watch-upstream
  cancel-in-progress: false

env:
  UPSTREAM: NousResearch/hermes-agent
  OURS: ${{ github.repository }}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # A build we dispatched that did not survive means something in the
      # chain is broken — and the watcher's own contribution to that is to
      # re-dispatch the same thing every 12h, each run another red X in the
      # feed. So: one failure, then stop watching. This step exits 0 while
      # paused, deliberately: a schedule that keeps failing is a schedule
      # nobody reads.
      - name: Circuit breaker — did our last dispatched build survive?
        id: breaker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -eu
          getv() { gh variable get "$1" --repo "$OURS" 2>/dev/null || true; }

          if [ "$FORCE" = "true" ]; then
            gh variable delete WATCH_PAUSED         --repo "$OURS" >/dev/null 2>&1 || true
            gh variable delete WATCH_LAST_RUN_ID    --repo "$OURS" >/dev/null 2>&1 || true
            echo "forced: breaker cleared, watching again."
            exit 0
          fi

          if [ "$(getv WATCH_PAUSED)" = "true" ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "watching is PAUSED — a build we dispatched failed."
            echo "fix the build, then re-run this workflow with force=true to resume."
            exit 0
          fi

          LAST="$(getv WATCH_LAST_RUN_ID)"
          if [ -z "$LAST" ]; then
            echo "no dispatched build on record — watching."
            exit 0
          fi

          VERDICT="$(gh run view "$LAST" --repo "$OURS" \
            --json status,conclusion,htmlUrl \
            --jq '[.status,.conclusion,.htmlUrl] | @tsv' 2>/dev/null || true)"
          [ -n "$VERDICT" ] || { echo "could not read run $LAST — watching."; exit 0; }
          IFS="$(printf '\t')" read -r STATUS CONCLUSION URL <<< "$VERDICT"

          if [ "$STATUS" != "completed" ]; then
            echo "dispatched build $LAST is still $STATUS — watching."
            exit 0
          fi
          if [ "$CONCLUSION" = "success" ]; then
            gh variable delete WATCH_LAST_RUN_ID --repo "$OURS" >/dev/null 2>&1 || true
            echo "last dispatched build succeeded — watching."
            exit 0
          fi

          # Only reached on a real failure. Park the breaker and say so once
          # (an open issue already covering it suppresses a new one), so the
          # stop is visible without being a notification stream.
          gh label create watch-paused --repo "$OURS" --force \
            --description "watch-upstream stopped after a dispatched build failed" >/dev/null
          gh variable set WATCH_PAUSED --repo "$OURS" --body "true"
          echo "paused=true" >> "$GITHUB_OUTPUT"
          echo "::warning title=watch-upstream paused::dispatched build $LAST ended $CONCLUSION — $URL"
          OPEN="$(gh issue list --repo "$OURS" --state open --label watch-paused \
                  --json number --jq 'length' 2>/dev/null || echo 0)"
          if [ "$OPEN" = "0" ]; then
            gh issue create --repo "$OURS" \
              --title "watch-upstream paused: build $LAST ended $CONCLUSION" \
              --label watch-paused \
              --body "The wheel build dispatched by [watch-upstream run $GITHUB_RUN_ID] ended \`$CONCLUSION\`: $URL

          Watching is paused so this does not recur on every scheduled tick. Fix the build, then re-run \`watch-upstream\` with \`force=true\` to resume."
          fi

      # Everything below is gated on these two entry points being `paused`
      # explicitly, or on `steps.upstream.outputs.changed` / `steps.dev.outputs.build`
      # being unset because their producing step did not run.
      - name: Sync stability of existing releases
        if: steps.breaker.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh release list --repo "$OURS" -L 20 \
              --json tagName,isPrerelease,isDraft --jq '.[]' > ours.jsonl || true
          if [ ! -s ours.jsonl ]; then
            echo "no releases in $OURS yet; nothing to sync."
            exit 0
          fi
          flipped=0
          while IFS= read -r row; do
            tag="$(echo "$row" | jq -r .tagName)"
            our_pre="$(echo "$row" | jq -r .isPrerelease)"
            our_draft="$(echo "$row" | jq -r .isDraft)"
            [ "$our_draft" = "true" ] && continue
            up_json="$(gh release view "$tag" --repo "$UPSTREAM" --json isPrerelease 2>/dev/null || true)"
            [ -z "$up_json" ] && continue
            up_pre="$(echo "$up_json" | jq -r .isPrerelease)"
            if [ "$our_pre" != "$up_pre" ]; then
              echo "  $tag: ours=prerelease:$our_pre upstream=prerelease:$up_pre → flipping"
              if [ "${{ inputs.dry_run }}" = "true" ]; then
                echo "    (dry-run: skipping edit)"
              else
                gh release edit "$tag" --repo "$OURS" --prerelease="$up_pre"
                flipped=$((flipped + 1))
              fi
            fi
          done < ours.jsonl
          echo "flipped $flipped release(s) to match upstream stability."

      - name: Detect upstream latest
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED: ${{ inputs.force_version }}
        run: |
          set -eu
          if [ -n "$FORCED" ]; then
            LATEST="${FORCED#v}"
            echo "using forced version: $LATEST"
            UP_PRE="$(gh release view "v$LATEST" --repo "$UPSTREAM" --json isPrerelease --jq .isPrerelease 2>/dev/null || echo false)"
          else
            # Include prereleases: we mirror upstream's flag, so the newest
            # tag wins regardless of stability. --exclude-drafts still applies.
            # Filter to version-shaped tags (v2026.9.14-style dates or vX.Y.Z);
            # anything else we can't track in versions.json.
            row="$(gh release list --repo "$UPSTREAM" --exclude-drafts -L 20 \
                --json tagName,isPrerelease \
                --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0]')"
            if [ -z "$row" ] || [ "$row" = "null" ]; then
              echo "error: could not resolve latest $UPSTREAM release" >&2
              exit 1
            fi
            LATEST_TAG="$(echo "$row" | jq -r .tagName)"
            UP_PRE="$(echo "$row" | jq -r .isPrerelease)"
            LATEST="${LATEST_TAG#v}"
          fi
          CURRENT="$(jq -r '.hermes' versions.json)"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "upstream_prerelease=$UP_PRE" >> "$GITHUB_OUTPUT"
          echo "current hermes-bionic pin: $CURRENT"
          echo "latest $UPSTREAM release: $LATEST (prerelease=$UP_PRE)"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no bump needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — tag exists upstream
        # Catch upstream renames/removals before dispatching the build. The
        # tag is a hard requirement (the container clones it). Everything
        # else upstream can move without it meaning anything about us — and
        # a red X on this job every 12h is how the real signal gets lost.
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.upstream.outputs.latest }}
        run: |
          set -eu
          gh api "repos/$UPSTREAM/git/refs/tags/v$NEW" --jq .object.sha >/dev/null
          echo "preflight OK — tag v$NEW exists upstream"

          # constraints-termux.txt was deleted upstream when its exact pins
          # moved into pyproject.toml, so its absence is normal, not a
          # failure. Report it so a resolver surprise is still traceable.
          if gh api "repos/$UPSTREAM/contents/constraints-termux.txt?ref=v$NEW" --jq .sha >/dev/null 2>&1; then
            echo "constraints-termux.txt present at v$NEW — build will resolve with -c"
          else
            echo "note: no constraints-termux.txt at v$NEW — build resolves from pyproject.toml's exact pins"
          fi

      - name: Bump versions.json
        if: steps.upstream.outputs.changed == 'true'
        env:
          NEW: ${{ steps.upstream.outputs.latest }}
        run: |
          set -eu
          jq --arg v "$NEW" '.hermes = $v' versions.json > versions.json.new
          mv versions.json.new versions.json
          echo "diff:"
          git --no-pager diff --stat

      - name: Verify tag is unused
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.upstream.outputs.latest }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$OURS" >/dev/null 2>&1; then
            echo "error: release $TAG already exists in $OURS. Delete it or bump manually." >&2
            exit 1
          fi

      - name: Commit + push (skipped on dry_run)
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run != true
        env:
          NEW: ${{ steps.upstream.outputs.latest }}
          OLD: ${{ steps.upstream.outputs.current }}
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore(upstream): bump hermes $OLD → $NEW" \
                     -m "Auto-bumped by watch-upstream.yml from $UPSTREAM."
          git push origin HEAD:main

      - name: Dispatch build (mirror upstream stability)
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.upstream.outputs.latest }}
          UP_PRE: ${{ steps.upstream.outputs.upstream_prerelease }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          set -eu
          gh workflow run build.yml \
            --ref main \
            -f version="$NEW" \
            -f draft="$DRAFT" \
            -f prerelease="$UP_PRE"
          echo "dispatched build.yml for v$NEW (prerelease=$UP_PRE)"

      - name: Dry-run summary
        if: steps.upstream.outputs.changed == 'true' && inputs.dry_run == true
        env:
          NEW: ${{ steps.upstream.outputs.latest }}
          OLD: ${{ steps.upstream.outputs.current }}
          UP_PRE: ${{ steps.upstream.outputs.upstream_prerelease }}
        run: |
          echo "DRY RUN: would bump $OLD → $NEW, commit to main, and dispatch build.yml with prerelease=$UP_PRE."

      - name: Detect new upstream main commits
        id: dev
        if: steps.breaker.outputs.paused != 'true' && steps.upstream.outputs.changed != 'true' && inputs.skip_dev != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          MAIN="$(gh api "repos/$UPSTREAM" --jq .default_branch)"
          SHA="$(gh api "repos/$UPSTREAM/commits/$MAIN" --jq .sha)"
          SHORT="$(printf '%s' "$SHA" | cut -c1-8)"

          # build.yml derives nothing from the checkout; the tag is ours to
          # define, but it must be unique per commit — so embed the upstream
          # package version AT THAT COMMIT plus the short sha.
          VERSION="$(gh api "repos/$UPSTREAM/contents/pyproject.toml?ref=$SHA" \
            --jq .content | base64 -d | sed -n 's/^version = "\([^"]*\)".*/\1/p' | head -1)"
          # Upstream stopped stamping a real version into pyproject.toml (it
          # is "0.0.0" now — the release tag is the version). Without this
          # fallback every dev build would collide on tag v0.0.0-dev.<sha>
          # and, worse, two different commits would publish the same version
          # number in the release title.
          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0" ]; then
            VERSION="$(gh release list --repo "$UPSTREAM" --exclude-drafts -L 20 \
              --json tagName --jq '.[0].tagName // empty' | sed 's/^v//')"
            echo "pyproject.toml@$SHORT has no real version — basing the dev tag on the newest upstream release ($VERSION)" >&2
          fi
          [ -n "$VERSION" ] || { echo "error: could not determine a version for $SHORT" >&2; exit 1; }
          TAG="v${VERSION}-dev.${SHORT}"
          echo "upstream $MAIN head: $SHA (upstream reports v$VERSION) → $TAG"

          # Nothing new since the last dev build we shipped.
          if gh release view "$TAG" --repo "$OURS" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "already released $TAG — no new commits."
            exit 0
          fi

          # main sitting exactly on a release tag means upstream just cut that
          # release from it. Building it as a dev prerelease would ship a
          # second copy of a tree we either already have or are about to get
          # through the stable path.
          REL_TAG="$(gh release list --repo "$UPSTREAM" --exclude-drafts -L 20 \
            --json tagName --jq '[.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0].tagName // empty')"
          if [ -n "$REL_TAG" ]; then
            REL_SHA="$(gh api "repos/$UPSTREAM/commits/$REL_TAG" --jq .sha 2>/dev/null || true)"
            if [ "$REL_SHA" = "$SHA" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "main head is release $REL_TAG — stable path covers it."
              exit 0
            fi
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}-dev.${SHORT}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Dispatch dev prerelease
        if: steps.dev.outputs.build == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.dev.outputs.sha }}
          VERSION: ${{ steps.dev.outputs.version }}
          TAG: ${{ steps.dev.outputs.tag }}
          DRAFT: ${{ inputs.draft || false }}
        run: |
          set -eu
          # Pass the resolved SHA, not the branch: it can move between this
          # step and the clone, and then the build would produce a tag other
          # than the one the dedup check above cleared.
          gh workflow run build.yml \
            --ref main \
            -f version="$VERSION" \
            -f upstream_ref="$SHA" \
            -f draft="$DRAFT" \
            -f prerelease=true
          echo "dispatched dev build of $SHA → $TAG (prerelease)"

      - name: Record the build we dispatched
        # `gh workflow run` returns nothing, so find the run it created and
        # remember it: the circuit breaker reads this id on the next tick and
        # pauses if the build it produced did not survive.
        if: (steps.upstream.outputs.changed == 'true' || steps.dev.outputs.build == 'true') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ID=""
          for _ in $(seq 1 30); do
            ID="$(gh run list --repo "$OURS" --workflow build.yml --branch main --limit 5 \
              --json databaseId,status \
              --jq '[.[] | select(.status != "completed")] | .[0].databaseId // empty' 2>/dev/null || true)"
            [ -n "$ID" ] && break
            sleep 2
          done
          [ -n "$ID" ] || {
            # Do NOT fail here: the breaker simply has nothing to check next
            # tick, and failing this job is exactly the red-X noise the
            # breaker exists to avoid.
            echo "::warning title=watch-upstream::build dispatched, but no run id could be found to track — the circuit breaker will not be able to judge this build"
            exit 0
          }
          gh variable set WATCH_LAST_RUN_ID --repo "$OURS" --body "$ID"
          gh variable delete WATCH_PAUSED --repo "$OURS" >/dev/null 2>&1 || true
          echo "tracking build run $ID — the circuit breaker will check its verdict next tick."

      - name: Dev dry-run summary
        if: steps.dev.outputs.build == 'true' && inputs.dry_run == true
        env:
          SHA: ${{ steps.dev.outputs.sha }}
          TAG: ${{ steps.dev.outputs.tag }}
        run: |
          echo "DRY RUN: would dispatch build.yml for main commit $SHA → $TAG (prerelease=true)."

      - name: Resume — close the pause notice
        # Only reached on a forced run. Clearing the breaker without closing
        # the issue it raised leaves a stale "paused" notice lying around.
        if: inputs.force == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          for n in $(gh issue list --repo "$OURS" --state open --label watch-paused \
                     --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$OURS" \
              --comment "Resumed by a forced watch-upstream run ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          done
